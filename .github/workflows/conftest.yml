name: Policy Validation - Conftest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conftest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          CONFTELATEST=$(curl -s https://api.github.com/repos/open-policy-agent/conftest/releases/latest | grep tag_name | cut -d '"' -f 4)
          wget "https://github.com/open-policy-agent/conftest/releases/download/${CONFTELATEST}/conftest_${CONFTELATEST#v}_Linux_x86_64.tar.gz"
          tar xzf conftest_${CONFTELATEST#v}_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Validate policies
        run: |
          if [ -d policy ]; then
            conftest test terraform/
          else
            echo "No policy directory yet. Skipping."
          fi
