apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: titan-platform-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/ArchAndrew/Self-Service-Platform.git
        revision: main
        directories:
          - path: gitops/apps/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: titan
      source:
        repoURL: https://github.com/ArchAndrew/Self-Service-Platform.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
